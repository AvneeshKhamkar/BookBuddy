<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Book | BookBuddy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<style>

body{

background:linear-gradient(135deg,#fce2db,#e7f0ff,#e5f8f6,#fde6f2);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:'Segoe UI',sans-serif;

}

.container-box{

max-width:600px;

background:rgba(255,255,255,0.9);

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,0.1);

}

h2{

font-weight:800;

color:#2f3d56;

margin-bottom:20px;

}

.form-control, .form-select{

border-radius:12px;

}

.btn-primary{

background:linear-gradient(135deg,#7acfc0,#a0d8ef);

border:none;

border-radius:12px;

font-weight:700;

padding:10px;

}

.btn-primary:hover{

transform:translateY(-2px);

}

#message{

margin-top:15px;

}
</style>
</head>
<body>
<div class="container-box">
<h2 class="text-center">📚 Add New Book</h2>
<form id="addBookForm" enctype="multipart/form-data">
<!-- Title -->
<div class="mb-3">
<label class="form-label">Book Title</label>
<input type="text" name="title" class="form-control" required>
</div>
<!-- Author -->
<div class="mb-3">
<label class="form-label">Author</label>
<input type="text" name="author" class="form-control" required>
</div>
<!-- Genre -->
<div class="mb-3">
<label class="form-label">Genre</label>
<input type="text" name="genre" class="form-control">
</div>
<!-- Description -->
<div class="mb-3">
<label class="form-label">Description</label>
<textarea name="description" class="form-control"></textarea>
</div>
<!-- Condition -->
<div class="mb-3">
<label class="form-label">Condition</label>
<select name="book_condition" class="form-select" required>
<option value="New">New</option>
<option value="Good">Good</option>
<option value="Old">Old</option>
</select>
</div>
<!-- Missing Pages -->
<div class="mb-3">
<label class="form-label">Missing Pages</label>
<select name="missing_pages" class="form-select" required>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>
</div>
<!-- Highlighted -->
<div class="mb-3">
<label class="form-label">Highlighted</label>
<select name="highlighted" class="form-select" required>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>
</div>
<!-- Rating -->
<div class="mb-3">
<label class="form-label">Rating</label>
<select name="rating" class="form-select" required>
<option value="">Select Rating</option>
<option value="1">⭐ 1 / 5</option>
<option value="2">⭐⭐ 2 / 5</option>
<option value="3">⭐⭐⭐ 3 / 5</option>
<option value="4">⭐⭐⭐⭐ 4 / 5</option>
<option value="5">⭐⭐⭐⭐⭐ 5 / 5</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Book Price (₹)</label>
<input type="number" name="price" class="form-control" required>
</div>
<!-- Image -->
<div class="mb-3">
<label class="form-label">Book Cover</label>
<input type="file" name="image" class="form-control" accept="image/*">
</div>
<button type="submit" class="btn btn-primary w-100">

➕ Add Book
</button>
</form>
<div id="message"></div>
<div class="text-center mt-3">
<a href="dashboard.php" class="btn btn-outline-secondary">

⬅ Back to Dashboard
</a>
</div>
</div>
<script>

$(document).ready(function(){

$("#addBookForm").submit(function(e){

e.preventDefault();

let formData = new FormData(this);

$.ajax({

url: "../backend/add_book.php",

type: "POST",

data: formData,

processData: false,

contentType: false,

success: function(response){

console.log(response);

if(response.status === "success"){

$("#message").html(

'<div class="alert alert-success">'

+ response.message +

'</div>'

);

$("#addBookForm")[0].reset();

setTimeout(function(){

window.location.href = "dashboard.php";

},1500);

}

else{

$("#message").html(

'<div class="alert alert-danger">'

+ response.message +

'</div>'

);

}

},

error: function(){

$("#message").html(

'<div class="alert alert-danger">Server error</div>'

);

}

});

});

});
</script>
 
</body>
</html>
