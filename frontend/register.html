<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | BookBuddy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<style>
body {
 height: 100vh;
 margin: 0;
 background: linear-gradient(135deg, #43cea2, #185a9d);
 display: flex;
 justify-content: center;
 align-items: center;
 font-family: 'Segoe UI';
}
.card-box {
 width: 400px;
 padding: 35px;
 border-radius: 20px;
 background: rgba(255,255,255,0.15);
 backdrop-filter: blur(20px);
 box-shadow: 0 10px 30px rgba(0,0,0,0.2);
 color: white;
}
h2 {
 text-align: center;
 margin-bottom: 15px;
}
.form-control {
 border-radius: 12px;
 border: none;
}
.error {
 color: #ffd1d1;
 font-size: 13px;
 margin-bottom: 8px;
}
.btn-register {
 width: 100%;
 border-radius: 12px;
 background: #00c9a7;
 border: none;
 font-weight: bold;
}
.btn-register:hover {
 background: #00a98b;
}
</style>
</head>
<body>
<div class="card-box">
<h2>📚 Register</h2>
<form id="registerForm">
<input type="text" name="name" class="form-control mb-2" placeholder="Full Name">
<div class="error" id="nameError"></div>
<input type="email" name="email" class="form-control mb-2" placeholder="Email">
<div class="error" id="emailError"></div>
<input type="password" name="password" class="form-control mb-2" placeholder="Password">
<div class="error" id="passError"></div>
<input type="password" id="confirm" class="form-control mb-2" placeholder="Confirm Password">
<div class="error" id="confirmError"></div>
<button class="btn btn-register mt-2">Register</button>
</form>
<p class="text-center mt-3">
<a href="index.html" style="color:white;">Already have account?</a>
</p>
</div>
<script>
$("#registerForm").submit(function(e){
 e.preventDefault();
 let name = $("input[name='name']").val().trim();
 let email = $("input[name='email']").val().trim();
 let password = $("input[name='password']").val();
 let confirm = $("#confirm").val();
 $(".error").text("");
 let valid = true;
 let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
 if(name === ""){
   $("#nameError").text("Enter name");
   valid = false;
 }
 if(!email.match(pattern)){
   $("#emailError").text("Invalid email");
   valid = false;
 }
 if(password.length < 6){
   $("#passError").text("Min 6 characters required");
   valid = false;
 }
 if(password !== confirm){
   $("#confirmError").text("Passwords do not match");
   valid = false;
 }
 if(!valid) return;
 $.ajax({
   url:"../backend/register.php",
   type:"POST",
   data:$(this).serialize(),
   dataType:"json",
   success:function(res){
     if(res.status==="success"){
       window.location.href="index.html";
     } else {
       $("#emailError").text(res.message);
     }
   }
 });
});
</script>
</body>
</html>
